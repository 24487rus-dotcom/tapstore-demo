<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TapStore — рабочее демо</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#213830;font:16px/1.5 system-ui,sans-serif}
header,main{width:min(1100px,92%);margin:auto}header{display:flex;align-items:center;justify-content:space-between;padding:20px 0;gap:12px}
main{padding:16px 0 64px}.logo{font-weight:850;font-size:29px;text-decoration:none;letter-spacing:-1px}.logo span{color:#916024}
a{color:#205644}h1{font-size:clamp(28px,5vw,49px);line-height:1.1;margin:0 0 16px}h2{margin-top:0}h3{margin:0 0 8px}
p{margin:0 0 16px}.muted{color:#52675e}.hero{background:#193f34;color:#fff;border-radius:24px;padding:clamp(22px,5vw,55px);margin-bottom:22px}.hero p{color:#e0ebe3}
.columns,.grid{display:grid;gap:16px;align-items:start}.columns{grid-template-columns:repeat(2,minmax(0,1fr))}.grid{grid-template-columns:repeat(auto-fit,minmax(min(215px,100%),1fr))}
.panel{background:#fff;border:1px solid #dce1d8;border-radius:16px;padding:20px;margin-bottom:16px}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.line{padding:10px 0;border-top:1px solid #e4e7df}.pill{padding:4px 10px;border-radius:20px;background:#e5efe6;font-size:14px}
label{display:block;margin:0 0 12px;font-weight:650}input,select{width:100%;padding:10px;border:1px solid #a8b8ae;border-radius:8px;font:inherit;margin-top:4px}input[type=checkbox]{width:auto}
button,.button{display:inline-block;border:0;border-radius:8px;background:#21513f;color:#fff;padding:9px 14px;font:inherit;font-weight:650;cursor:pointer;text-decoration:none}
button.secondary,.button.secondary{background:#e5eee7;color:#204637}button:disabled{opacity:.55;cursor:wait}:focus-visible{outline:3px solid #b06a19;outline-offset:3px}
#notice:not(:empty){background:#f6e8d6;padding:12px;border-radius:8px;margin-bottom:16px}form{margin:0}input.quantity{width:68px}details summary{cursor:pointer;font-weight:650}details form{margin-top:12px}
.manage-hero{padding:clamp(18px,3vw,30px)}.manage-hero h1{font-size:clamp(26px,4vw,38px)}.manage-hero p{margin-bottom:6px}.manage-hero span{overflow-wrap:anywhere}
.manage-nav{display:flex;flex-wrap:wrap;gap:6px;padding:6px;margin-bottom:20px;background:#fff;border:1px solid #dce1d8;border-radius:14px}
.manage-nav a{padding:8px 14px;border-radius:8px;text-decoration:none;font-weight:650}.manage-nav a:hover{background:#e5eee7}.manage-nav a[aria-current="page"]{background:#21513f;color:#fff}
.manage-title{margin-bottom:12px}.manage-title h2{margin:0}.manage-settings{max-width:680px}
.store-switcher{margin-bottom:14px}.store-switcher form{align-items:end}.store-switcher label{margin:0}.store-switcher select{min-width:min(210px,65vw)}
.auth-panel{max-width:520px;margin:0 auto 16px}.auth-panel .manage-nav{margin-bottom:16px}
.auth-modes{display:flex;gap:6px;background:#f0f3ee;border-radius:10px;padding:4px;margin-bottom:16px}
.auth-modes button{flex:1;background:transparent;color:#204637}.auth-modes button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px #193f3422}
.product-photo{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:10px;margin-bottom:12px;background:#f0f3ee}
button.secondary.danger{background:#f8eae5;color:#8b3022}
#order-filters button[aria-pressed="true"]{background:#21513f;color:#fff}
.table-scroll{overflow-x:auto;margin:12px 0 24px}table{border-collapse:collapse;width:100%;text-align:left}th,td{padding:12px;border-bottom:1px solid #dce1d8;vertical-align:top}th{background:#f0f3ee}#financial-report{margin-top:20px}#ledger-feedback{margin-top:12px}
.panel,.columns>*,.grid>*{min-width:0}h3,td,.staff-access{overflow-wrap:anywhere}input,select{min-width:0}button,.button{min-height:44px}.demo-controls p{margin-top:8px}.demo-controls{margin-bottom:24px}
@media(max-width:440px){.manage-nav a{padding:10px}.row{gap:10px}input,select{font-size:16px}#report-period{display:grid;grid-template-columns:minmax(0,1fr)}#report-period label{margin:0}}
@media(max-width:680px){.columns{grid-template-columns:1fr}.panel{padding:16px}}
</style>
<script src="./app.js" type="module"></script>
</head>
<body>
<header><a href="/" class="logo">tap<span>store</span></a><a id="cabinet-link" href="/?role=owner">Вход по ролям</a></header>
<main><div id="notice" role="status"></div><div id="page"><p>Загрузка…</p></div></main>
</body>
</html>
